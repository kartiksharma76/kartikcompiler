<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KartikTerminal | Enterprise ERP Command Center</title>
<script src="/auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/responsive.css">
<!-- Chart.js for Advanced Analytics -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- html2pdf for PDF generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-deep: #060810;
  --bg-sidebar: #0a0d18;
  --bg-panel: #0d1120;
  --bg-card: #111728;
  --bg-card-alt: #161e34;
  --border: rgba(255, 255, 255, 0.08);
  --border-glow: rgba(99, 102, 241, 0.3);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --accent-purple: #8b5cf6;
  --accent-indigo: #6366f1;
  --accent-blue: #38bdf8;
  --accent-cyan: #06b6d4;
  --accent-green: #10b981;
  --accent-orange: #f59e0b;
  --accent-red: #ef4444;
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

body {
  background: var(--bg-deep);
  background-image: 
    radial-gradient(circle at 50% -20%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
    radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
  background-attachment: fixed;
  color: var(--text-main);
  font-family: var(--font-sans);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  line-height: 1.5;
}

/* ── Top Navbar ── */
nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px; height: 64px; flex-shrink: 0;
  background: rgba(10, 13, 24, 0.92);
  border-bottom: 1px solid var(--border);
  z-index: 100;
  backdrop-filter: blur(20px);
}
.brand-link {
  display: flex; align-items: center; gap: 6px;
  font-weight: 800; font-size: 17px; text-decoration: none;
  color: #ffffff; letter-spacing: 0.5px;
}
.brand-link .sub-brand {
  color: var(--accent-blue);
  font-weight: 800;
  text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
}
.nav-links { display: flex; align-items: center; gap: 32px; }
.nav-links a {
  color: var(--text-muted); font-size: 13px; font-weight: 600; text-decoration: none;
  transition: all 0.2s ease; display: flex; align-items: center; gap: 6px;
  position: relative; padding: 8px 0;
}
.nav-links a:hover, .nav-links a.active { color: #ffffff; }
.nav-links a.active::after {
  content: ''; position: absolute; bottom: -12px; left: 0; width: 100%; height: 2px;
  background: linear-gradient(90deg, #6366f1, #38bdf8);
  box-shadow: 0 0 10px #38bdf8;
  border-radius: 2px;
}
.logout-btn {
  background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.3);
  color: #fca5a5; padding: 6px 14px; border-radius: 8px; cursor: pointer;
  font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px;
  transition: all 0.2s ease;
}
.logout-btn:hover { background: var(--accent-red); color: white; border-color: var(--accent-red); box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

/* ── Shell Container ── */
.workspace-container { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ── */
.workspace-sidebar {
  width: 250px; background: var(--bg-sidebar); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; justify-content: space-between;
}
.sidebar-top { padding: 20px 14px 10px; }
.sidebar-heading {
  font-size: 10.5px; font-weight: 800; color: #818cf8; letter-spacing: 1px;
  text-transform: uppercase; margin-bottom: 14px; padding-left: 10px;
}
.module-list { display: flex; flex-direction: column; gap: 4px; }
.module-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border-radius: 10px; cursor: pointer; transition: all 0.2s ease;
  font-size: 12.5px; color: var(--text-muted); font-weight: 600;
  border: 1px solid transparent;
}
.module-item:hover {
  background: rgba(255, 255, 255, 0.04); color: var(--text-main);
}
.module-item.active {
  background: linear-gradient(90deg, rgba(99, 102, 241, 0.22), rgba(139, 92, 246, 0.12));
  border-color: rgba(99, 102, 241, 0.45);
  color: #ffffff;
  box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
}
.module-icon {
  width: 24px; height: 24px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
  background: rgba(255, 255, 255, 0.05); flex-shrink: 0;
}
.module-item.active .module-icon {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
}

/* Sidebar Footer Badge */
.sidebar-footer {
  padding: 16px; border-top: 1px solid var(--border); margin: 0 12px 14px;
  background: rgba(17, 23, 40, 0.6); border: 1px solid var(--border); border-radius: 12px;
}
.sidebar-footer-brand {
  display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #fff;
}
.sidebar-footer-sub { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.sidebar-footer-status {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 10px; color: var(--text-muted); margin-top: 10px; padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}
.online-dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: #10b981; box-shadow: 0 0 8px #10b981; margin-right: 4px;
}

/* ── Main View Panel ── */
.workspace-main {
  flex: 1; display: flex; flex-direction: column; overflow-y: auto;
  padding: 28px 36px 40px; position: relative; width: 100%;
}
.tab-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px; position: relative;
}
.tab-header-left {
  display: flex; align-items: center; gap: 14px;
}
.tab-icon-box {
  width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(139, 92, 246, 0.2));
  border: 1px solid rgba(139, 92, 246, 0.4);
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  box-shadow: 0 0 20px rgba(99, 102, 241, 0.25); flex-shrink: 0;
}
.tab-title { font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: -0.3px; }
.tab-subtitle { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

/* ── Buttons ── */
.btn-primary {
  background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white;
  border: 1px solid rgba(255,255,255,0.15); padding: 9px 18px; border-radius: 10px;
  font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
  display: inline-flex; align-items: center; gap: 8px;
  box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 22px rgba(99, 102, 241, 0.55);
}
.btn-secondary {
  background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
  color: var(--text-main); padding: 8px 14px; border-radius: 8px;
  font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-secondary:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.15); }

/* ── Grid & Cards ── */
.bento-grid {
  display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; width: 100%;
}
.bento-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 14px; padding: 20px 22px; position: relative; overflow: hidden;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}
.col-3 { grid-column: span 3; }
.col-4 { grid-column: span 4; }
.col-5 { grid-column: span 5; }
.col-6 { grid-column: span 6; }
.col-7 { grid-column: span 7; }
.col-8 { grid-column: span 8; }
.col-9 { grid-column: span 9; }
.col-12 { grid-column: span 12; }

/* Mini Metric Tiles */
.metric-header {
  display: flex; justify-content: space-between; align-items: flex-start;
}
.metric-title {
  font-size: 11px; font-weight: 700; color: var(--text-muted);
  letter-spacing: 0.5px; text-transform: uppercase;
}
.metric-badge-icon {
  width: 28px; height: 28px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; font-size: 13px;
}
.metric-val-big {
  font-size: 34px; font-weight: 800; font-family: var(--font-mono);
  color: #ffffff; margin: 8px 0 4px; letter-spacing: -0.5px;
}
.metric-foot {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px; font-weight: 600;
}
.trend-positive { color: var(--accent-green); }
.trend-sub { color: var(--text-dim); }

/* Tables */
.custom-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.custom-table th {
  padding: 12px 14px; text-align: left; font-size: 10.5px; font-weight: 700;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px;
  border-bottom: 1px solid var(--border);
}
.custom-table td {
  padding: 12px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  color: var(--text-main); vertical-align: middle;
}
.custom-table tr:hover td { background: rgba(255, 255, 255, 0.02); }

/* Inputs & Forms */
.form-input {
  width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--border); border-radius: 8px; color: #ffffff;
  font-family: inherit; font-size: 13px; outline: none; transition: all 0.2s;
}
.form-input:focus { border-color: var(--accent-purple); box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.25); }

/* Dropdown Pill Filter */
.pill-filter-btn {
  background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
  color: var(--text-muted); padding: 5px 12px; border-radius: 8px;
  font-size: 11.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}

/* Empty State Box */
.empty-state-box {
  padding: 40px 20px; text-align: center; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px;
}
.empty-icon-glow {
  width: 60px; height: 60px; border-radius: 18px;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(139, 92, 246, 0.05) 70%);
  border: 1px solid rgba(99, 102, 241, 0.3);
  display: flex; align-items: center; justify-content: center; font-size: 26px;
  box-shadow: 0 0 30px rgba(99, 102, 241, 0.2); margin-bottom: 4px;
}

/* Footer Banner */
.page-footer {
  margin-top: auto; padding-top: 32px; display: flex; justify-content: space-between;
  align-items: center; font-size: 11px; color: var(--text-dim);
}
</style>
</head>
<body>

<!-- ── Navigation ── -->
<nav>
  <a class="brand-link" href="/college.html">
    <span>KARTIKTERMINAL</span>
    <span class="sub-brand">| ENTERPRISE</span>
  </a>
  <div class="nav-links">
    <a href="/compiler.html">✏️ Editor</a>
    <a href="/dashboard.html">📊 Dashboard</a>
    <a href="/college.html" class="active">🎯 Admin Section</a>
    <a href="/intelligence.html">✨ AI Suite</a>
  </div>
  <button class="logout-btn" onclick="KTAuth.logout()">🚪 Logout</button>
</nav>

<!-- ── Main Workspace ── -->
<div class="workspace-container">
  
  <!-- Sidebar -->
  <div class="workspace-sidebar">
    <div class="sidebar-top">
      <div class="sidebar-heading">Global Command Center</div>
      <div class="module-list">
        <div class="module-item active" id="menu-analytics" onclick="switchTab('analytics')">
          <div class="module-icon">📊</div>
          <div>Global Analytics</div>
        </div>
        <div class="module-item" id="menu-anticheat" onclick="switchTab('anticheat')">
          <div class="module-icon">👁️</div>
          <div>Live Anti-Cheat Monitor</div>
        </div>
        <div class="module-item" id="menu-autograder" onclick="switchTab('autograder')">
          <div class="module-icon">🤖</div>
          <div>AI Auto-Grader</div>
        </div>
        <div class="module-item" id="menu-exams" onclick="switchTab('exams')">
          <div class="module-icon">📑</div>
          <div>Exam & Contest Hub</div>
        </div>
        <div class="module-item" id="menu-teams" onclick="switchTab('teams')">
          <div class="module-icon">👥</div>
          <div>Team Formations</div>
        </div>
        <div class="module-item" id="menu-admin" onclick="switchTab('admin')">
          <div class="module-icon">⚙️</div>
          <div>Admin Section</div>
        </div>
      </div>
    </div>

    <!-- Sidebar Bottom Badge -->
    <div class="sidebar-footer">
      <div class="sidebar-footer-brand">
        <span style="font-size:16px;">🛡️</span>
        <div>KartikTerminal Enterprise</div>
      </div>
      <div class="sidebar-footer-sub">Powering Education with AI</div>
      <div class="sidebar-footer-status">
        <span>⏱️ v2.4.0</span>
        <span><span class="online-dot"></span>System Online</span>
      </div>
    </div>
  </div>

  <!-- Main Content Body -->
  <div class="workspace-main" id="mainContent">
    <!-- Dynamic View Injection -->
  </div>
</div>

<script>
let currentTab = localStorage.getItem('collegeCurrentTab') || 'analytics';

function switchTab(tab) {
  currentTab = tab;
  localStorage.setItem('collegeCurrentTab', tab);
  document.querySelectorAll('.module-item').forEach(el => el.classList.remove('active'));
  const activeMenu = document.getElementById(`menu-${tab}`);
  if (activeMenu) activeMenu.classList.add('active');
  renderTab();
}

async function renderTab() {
  const main = document.getElementById('mainContent');
  
  // ==============================================================
  // 1. GLOBAL ANALYTICS TAB (MATCHING SCREENSHOT 1)
  // ==============================================================
  if (currentTab === 'analytics') {
    main.innerHTML = `
      <div class="tab-header">
        <div class="tab-header-left">
          <div class="tab-icon-box">📊</div>
          <div>
            <div class="tab-title">Global College Analytics</div>
            <div class="tab-subtitle">Real-time performance metrics across all students.</div>
          </div>
        </div>
        <button class="btn-primary" onclick="generatePDFReport()">📄 Generate PDF Report</button>
      </div>

      <!-- Top 3 Metric Cards -->
      <div class="bento-grid" style="margin-bottom: 16px;">
        
        <!-- Card 1: Today's Executions -->
        <div class="bento-card col-4" style="background: linear-gradient(135deg, #0d1224, #121832); border-color: rgba(99, 102, 241, 0.25);">
          <div class="metric-header">
            <span class="metric-title">TODAY'S EXECUTIONS</span>
            <div class="metric-badge-icon" style="background: rgba(139, 92, 246, 0.18); color: #a78bfa;">⚡</div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:flex-end;">
            <div>
              <div class="metric-val-big" id="valTodayRuns">17</div>
              <div style="font-size:12px; color:var(--accent-green); font-weight:600;"><span class="online-dot"></span>Live</div>
            </div>
            <!-- Wave SVG -->
            <svg width="120" height="42" viewBox="0 0 120 42" fill="none" style="margin-bottom:4px;">
              <path d="M0 32 C 20 32, 25 10, 45 28 C 65 42, 80 8, 95 18 C 105 25, 115 5, 120 4" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
          <div class="metric-foot" style="margin-top: 14px;">
            <span class="trend-positive">+13.3% vs yesterday</span>
          </div>
        </div>

        <!-- Card 2: Platform Success Rate -->
        <div class="bento-card col-4" style="background: linear-gradient(135deg, #091720, #0f2430); border-color: rgba(6, 182, 212, 0.25);">
          <div class="metric-header">
            <span class="metric-title">PLATFORM SUCCESS RATE</span>
            <div class="metric-badge-icon" style="background: rgba(6, 182, 212, 0.18); color: #38bdf8;">🎯</div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin: 4px 0;">
            <div>
              <div class="metric-val-big" id="valSuccessRate">83.3%</div>
              <div style="font-size:12px; color:var(--text-muted); font-weight:600;">Overall Average</div>
            </div>
            <!-- Circular Gauge SVG -->
            <div style="position:relative; width:58px; height:58px; display:flex; align-items:center; justify-content:center;">
              <svg width="58" height="58" viewBox="0 0 36 36">
                <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3.5"/>
                <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" stroke-dasharray="83.3, 100" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
              </svg>
              <span style="position:absolute; font-size:10px; font-weight:800; color:#fff; font-family:var(--font-mono);">83.3%</span>
            </div>
          </div>
          <div class="metric-foot" style="margin-top: 10px;">
            <span class="trend-positive">+4.7% vs last 7 days</span>
          </div>
        </div>

        <!-- Card 3: Security Vulnerabilities -->
        <div class="bento-card col-4" style="background: linear-gradient(135deg, #180d16, #24111f); border-color: rgba(239, 68, 68, 0.25);">
          <div class="metric-header">
            <span class="metric-title">SECURITY VULNERABILITIES DETECTED</span>
            <div class="metric-badge-icon" style="background: rgba(239, 68, 68, 0.18); color: #f87171;">🔒</div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin: 4px 0;">
            <div>
              <div class="metric-val-big" style="color:#ffffff;" id="valCheatLogs">0</div>
              <div style="font-size:12px; color:var(--text-muted); font-weight:600;">Total Anti-Cheat Logs</div>
            </div>
            <!-- Shield SVG -->
            <div style="width:48px; height:48px; border-radius:50%; border:1.5px solid rgba(239, 68, 68, 0.3); display:flex; align-items:center; justify-content:center; background: rgba(239, 68, 68, 0.06);">
              <span style="font-size:20px; color:#f87171;">🛡️</span>
            </div>
          </div>
          <div class="metric-foot" style="margin-top: 10px;">
            <span style="color:var(--accent-green); display:flex; align-items:center; gap:4px;">✔ All systems secure</span>
            <button class="btn-secondary" style="padding:3px 10px; font-size:11px; border-color:#10b981; color:#10b981;" onclick="adminUnlockAll()">Unlock All</button>
          </div>
        </div>

      </div>

      <!-- Middle Row: Language Usage & Student Leaderboard -->
      <div class="bento-grid">
        
        <!-- Left: Language Usage (7 cols) -->
        <div class="bento-card col-7" style="display:flex; flex-direction:column; justify-content:space-between;">
          <div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
              <div style="font-size:14px; font-weight:700; color:#fff; display:flex; align-items:center; gap:8px;">
                <span style="color:#818cf8;">📊</span> Language Usage & Performance
              </div>
              <button class="pill-filter-btn">📅 Last 7 Days ▾</button>
            </div>
            
            <!-- 3D Bar Chart Visual -->
            <div style="height: 180px; display:flex; align-items:flex-end; justify-content:space-between; padding: 10px 4px 0; border-bottom:1px solid rgba(255,255,255,0.06);">
              ${[
                { lang: 'C', count: 2, height: 28 },
                { lang: 'C++', count: 3, height: 42 },
                { lang: 'Java', count: 2, height: 28 },
                { lang: 'Python', count: 2, height: 28 },
                { lang: 'JavaScript', count: 11, height: 130, primary: true },
                { lang: 'Go', count: 2, height: 28 },
                { lang: 'Ruby', count: 5, height: 65 },
                { lang: 'PHP', count: 4, height: 52 },
                { lang: 'TypeScript', count: 2, height: 28 },
                { lang: 'Kotlin', count: 1, height: 16 },
                { lang: 'Swift', count: 1, height: 16 },
                { lang: 'Rust', count: 1, height: 16 }
              ].map(item => `
                <div style="display:flex; flex-direction:column; align-items:center; flex:1; gap:6px;">
                  <span style="font-size:10px; font-weight:700; color:#a5b4fc; font-family:var(--font-mono);">${item.count}</span>
                  <div style="width:18px; height:${item.height}px; background:linear-gradient(180deg, ${item.primary ? '#8b5cf6, #6366f1' : 'rgba(139, 92, 246, 0.8), rgba(99, 102, 241, 0.4)'}); border-radius:4px 4px 0 0; box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);"></div>
                  <span style="font-size:9.5px; color:var(--text-muted); font-weight:600; text-transform:none; margin-top:2px;">${item.lang}</span>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Bottom Metric Bar -->
          <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-top:16px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.05); text-align:center;">
            <div>
              <div style="font-size:16px; font-weight:800; color:#fff; font-family:var(--font-mono);">✏️ 36</div>
              <div style="font-size:10px; color:var(--text-dim); margin-top:2px;">Total Submissions</div>

// ── Backend API Helpers ──
async function fetchCheaterLog() {
  const tbody = document.getElementById('cheaterLogBody') || document.getElementById('liveCheatLogsBody');
  const emptyBox = document.getElementById('adminLogEmptyBox') || document.getElementById('anticheatEmptyBox');
  if(!tbody) return;

  try {
    const res = await fetch('/api/admin/users/cheaters', {
      headers: { 'Authorization': `Bearer ${KTAuth.getToken()}` }
    });
    if(!res.ok) return;
    const cheaters = await res.json();
    if(cheaters && cheaters.length > 0) {
      if (emptyBox) emptyBox.style.display = 'none';
      tbody.innerHTML = cheaters.map(c => `
        <tr>
          <td><div style="font-weight:600;">${c.fullName || c.username}</div><div style="font-size:11px; color:var(--text-dim);">@${c.username}</div></td>
          <td>${c.email}</td>
          <td><span style="color:#ef4444; font-weight:700;">${c.cheatViolations} 🚨</span></td>
          <td><span style="background:rgba(239,68,68,0.15); color:#f87171; padding:2px 8px; border-radius:4px; font-size:10.5px; font-weight:700;">Flagged</span></td>
          <td>
            <button class="btn-secondary" style="padding:2px 8px; font-size:10px; color:#10b981; border-color:#10b981;" onclick="adminAction(${c.id}, 'unlock')">Resolve</button>
            <button class="btn-secondary" style="padding:2px 8px; font-size:10px; color:#ef4444; border-color:#ef4444;" onclick="adminDeleteUserById(${c.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    } else {
      if (emptyBox) emptyBox.style.display = 'flex';
      tbody.innerHTML = '';
    }
  } catch(e) {}
}

async function fetchTeams() {
  const tbody = document.getElementById('teamsTableBody');
  const emptyBox = document.getElementById('teamsEmptyBox');
  if(!tbody) return;

  try {
    const res = await fetch('/api/teams', { headers: { 'Authorization': `Bearer ${KTAuth.getToken()}` } });
    if(res.ok) {
      const teams = await res.json();
      if(teams && teams.length > 0) {
        if(emptyBox) emptyBox.style.display = 'none';
        tbody.innerHTML = teams.map(t => `
          <tr>
            <td style="font-weight:700; color:#fff;">${t.name}</td>
            <td><code style="background:rgba(255,255,255,0.06); padding:3px 8px; border-radius:4px; font-family:var(--font-mono);">${t.teamCode}</code></td>
            <td>${t.members ? t.members.length : 0} Members</td>
            <td><span style="background:rgba(16,185,129,0.12); color:#10b981; padding:2px 8px; border-radius:4px; font-size:10.5px; font-weight:700;">Active</span></td>
            <td><button class="btn-secondary" style="padding:2px 8px; font-size:11px;">Manage</button></td>
          </tr>
        `).join('');
      } else {
        if(emptyBox) emptyBox.style.display = 'flex';
        tbody.innerHTML = '';
      }
    }
  } catch(e) {}
}

      <h3 style="margin-bottom:12px; font-size:15px; color:#fff;">Create New Exam</h3>
      <form onsubmit="submitExam(event)" style="display:flex; flex-direction:column; gap:8px;">
        <input type="text" id="exTitle" class="form-input" placeholder="Exam Title" required>
        <input type="text" id="exDesc" class="form-input" placeholder="Description" required>

async function submitExam(e) {
  e.preventDefault();
  const payload = {
    title: document.getElementById('exTitle').value,
    description: document.getElementById('exDesc').value,
    faculty: { id: 1 },
    startTime: new Date().toISOString(),
    endTime: new Date(Date.now() + 3600000).toISOString(),
    isActive: true,
    antiCheatEnabled: true
  };
  try {
    const res = await fetch('/api/exams/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${KTAuth.getToken()}` },
      body: JSON.stringify(payload)
    });
    if(res.ok) {
      alert("Exam Created!");
      switchTab('exams');
    }
  } catch(e) {}
}
